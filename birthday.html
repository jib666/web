<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Birthday</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap">
<style>
:root{--ink:#fff6e8;--night:#0a0733;--gold:#ffd166;color-scheme:dark}
@media (prefers-color-scheme:dark){:root{--ink:#fff6e8;--night:#0a0733}}
:root[data-theme="dark"]{--ink:#fff6e8;--night:#0a0733}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);padding:9px 18px;border-radius:999px;background:rgba(255,255,255,.12);font-size:15px;text-align:center;pointer-events:none;width:max-content;max-width:92vw}
#again{display:none;position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);left:50%;transform:translateX(-50%);font:inherit;font-weight:700;border:0;border-radius:999px;padding:11px 22px;background:var(--gold);color:#3b1a6e;cursor:pointer}
#again:focus-visible{outline:3px solid #fff;outline-offset:2px}
</style>
</head>
<body>
<canvas id="c" aria-label="Birthday surprise: drag back from the bow and release to launch a firework at the glowing orb"></canvas>
<div id="hint">Drag back from the bow, then let go to launch a firework at the glowing orb.</div>
<button id="again">Play again</button>
<script>
/* ============================================================
   PUT THE BIRTHDAY NAME HERE  ↓↓↓
   Example: const BIRTHDAY_NAME = "Aisha";
   Leave it empty ("") to show only "Happy Birthday"
   ============================================================ */
const BIRTHDAY_NAME = "Nisa";
/* ============================================================ */

(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
const WW=420,WH=760,G=450,BX=62,BY=600,PLATE=690,CX=210,HR=40;
const name=String(BIRTHDAY_NAME||'').trim();
const PAL=['#ff4d6d','#ffd23f','#4cc9f0','#7cff6b','#c77dff','#ff9f1c'];
const BAL=[['#fff1b8','#e0a81c'],['#ffc2a8','#ff5e5b'],['#c9fff0','#1fb89a'],['#ffffff','#a9c8ff']];
const FONT='"Great Vibes","Brush Script MT","Snell Roundhand",cursive';
let W,H,dpr,u,ox,oy,xmin,xmax,ymin,ymax;
let phase,time=0,tHit,tLand,tText,landed,bgMix,flash,shake,spawnT,ballT;
let shell,arrows,parts,pend,balloons,plate,tiers,drag=null,aim=0,len=0,cam={z:1},zip={};

function resize(){
  dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;
  u=Math.min(W/WW,H/WH);ox=(W-WW*u)/2;oy=(H-WH*u)/2;
  xmin=-ox/u;xmax=(W-ox)/u;ymin=-oy/u;ymax=(H-oy)/u;
}
function reset(){
  phase='aim';tHit=tLand=tText=0;landed=false;bgMix=0;flash=0;shake=0;spawnT=0;ballT=0;cam.z=1;
  arrows=[];parts=[];pend=[];balloons=[];
  shell={x:287,y:330,alive:true,dy:330};
  plate={y:-300,vy:0,st:'wait',sq:0,r:PLATE};
  tiers=[{w:230,h:52,r:638,c:'#ff9f68'},{w:168,h:46,r:592,c:'#ffd166'},{w:116,h:40,r:552,c:'#7ae0c3'}]
    .map((t,i)=>({...t,i,y:-400,vy:0,st:'wait',sq:0}));
  zip={on:false,y:0,t:0,drag:false,done:false,p:0,off:0};$('again').style.display='none';$('hint').textContent='Drag back from the bow, then let go to launch a firework at the glowing orb.';$('hint').style.display='block';
}
const toWorld=e=>({x:(e.clientX-ox)/u,y:(e.clientY-oy)/u});

/* input */
cv.addEventListener('pointerdown',e=>{
  if(phase==='zip'){zip.drag=true;zip.t=Math.min(H,Math.max(H*.1,e.clientY));cv.setPointerCapture(e.pointerId);return}
  if(phase!=='aim')return;
  const p=toWorld(e);drag={sx:p.x,sy:p.y};len=0;cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove',e=>{
  if(zip.drag){zip.t=Math.min(H,Math.max(H*.1,e.clientY));return}
  if(!drag)return;const p=toWorld(e);
  const dx=drag.sx-p.x,dy=drag.sy-p.y;len=Math.min(140,Math.hypot(dx,dy));aim=Math.atan2(dy,dx);
});
cv.addEventListener('pointerup',()=>{
  zip.drag=false;
  if(drag&&len>25){
    const sp=250+len*6.2,x=BX+Math.cos(aim)*50,y=BY+Math.sin(aim)*50;
    arrows.push({x,y,vx:Math.cos(aim)*sp,vy:Math.sin(aim)*sp,ang:aim,dead:false});
    $('hint').style.display='none';
  }
  drag=null;
});
cv.addEventListener('pointercancel',()=>{drag=null});

/* fireworks */
const rc=()=>PAL[(Math.random()*6)|0];
function burst(x,y,c,n,v){
  const c2=rc();
  for(let i=0;i<n;i++){
    const a=i/n*Math.PI*2+Math.random()*.2,sp=v*(.5+Math.random()*.5)*(i%2?.7:1);
    parts.push({k:'k',x,y,px:x,py:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,c:i%5===0?'#fff4c2':(i%3===0?c2:c),s:2+Math.random()*1.5,life:0,max:1.1+Math.random()*.7,drag:1.8,g:90});
  }
}
function spark(x,y,v,c,max,f){
  const a=Math.random()*7,s=Math.random()*v;
  parts.push({k:'k',f,x,y,px:x,py:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,c,s:1.5+Math.random()*2,life:0,max,drag:2.5,g:f?120:30});
}
function rocket(){
  const ty=ymin+(ymax-ymin)*(.08+Math.random()*.4);
  parts.push({k:'r',x:xmin+20+Math.random()*(xmax-xmin-40),y:ymax+10,vy:-(420+Math.random()*120),ty,c:rc(),life:0,max:99});
}
function pop(){
  phase='zip';flash=1;shell.alive=false;shake=rm?0:8;bgMix=1;zip={on:true,y:H*.14,t:H*.14,drag:false,done:false,p:0,off:0};
  const x=shell.x,y=shell.dy;
  pend.push({at:time,x,y,n:90,v:380},{at:time+.18,x:x-110,y:y-70,n:60,v:300},{at:time+.34,x:x+70,y:y+60,n:60,v:300},{at:time+.5,x:x-60,y:y+130,n:50,v:260});
  $('hint').textContent='Grab the zipper and drag it all the way down!';$('hint').style.display='block';
}
function puff(){
  for(let i=0;i<10;i++){const x=CX+(Math.random()-.5)*220;parts.push({k:'k',x,y:PLATE-4,px:x,py:PLATE-4,vx:(Math.random()-.5)*160,vy:-30-Math.random()*130,c:i%2?'#ffe9a8':'#fff',s:2,life:0,max:.7,drag:1.5,g:300})}
}
function balloon(l){
  const side=Math.random()<.5?-1:1,half=Math.min(190,(xmax-xmin)/2-20);
  balloons.push({l,x:l?CX+(Math.random()*2-1)*Math.min(165,half-14):CX+side*(40+Math.random()*(half-40)),y:ymax+80,vy:-(l?48+Math.random()*30:55+Math.random()*50),r:l?30+Math.random()*4:20+Math.random()*10,c:BAL[(Math.random()*4)|0],ph:Math.random()*6,wob:0});
}
function drawPanels(){
  const gw=zip.y*.42;
  for(const sd of[-1,1]){
    ctx.save();ctx.translate(sd*zip.off,0);
    ctx.beginPath();ctx.rect(sd<0?0:W/2,0,W/2,H);ctx.clip();
    ctx.beginPath();ctx.rect(-W,-10,W*3,H+20);ctx.moveTo(W/2,zip.y);ctx.lineTo(W/2-gw,-10);ctx.lineTo(W/2+gw,-10);ctx.closePath();
    ctx.clip('evenodd');drawNavy();
    ctx.restore();
  }
}
function drawZipHW(){
  if(!zip.on)return;
  const cx=W/2,y=zip.y,gw=y*.42,off=zip.off;
  ctx.save();
  for(let yy=y,i=0;yy<H;yy+=11,i++){
    ctx.fillStyle=i%2?'#f3d27a':'#c99a2e';
    ctx.fillRect(i%2?cx+off:cx-8-off,yy,8,6);
  }
  const L=Math.hypot(gw,y+10);
  for(const sd of[-1,1]){
    const ang=Math.atan2(-(y+10),sd*gw);
    for(let t=0,i=0;t<L;t+=11,i++){
      const f=t/L;
      ctx.save();ctx.translate(cx+sd*gw*f+sd*off,y-(y+10)*f);ctx.rotate(ang);
      ctx.fillStyle=(i+(sd>0?1:0))%2?'#f3d27a':'#c99a2e';
      ctx.fillRect(-4,i%2?-6:0,8,6);
      ctx.restore();
    }
  }
  if(!zip.done){
    ctx.shadowColor='rgba(0,0,0,.4)';ctx.shadowBlur=10;
    const g=ctx.createLinearGradient(cx-17,0,cx+17,0);g.addColorStop(0,'#aeb4c8');g.addColorStop(.5,'#f4f6fb');g.addColorStop(1,'#9aa2ba');
    ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(cx-17,y-28,34,46,9);ctx.fill();
    ctx.fillStyle='#f3d27a';ctx.beginPath();ctx.roundRect(cx-10,y+12,20,46,10);ctx.fill();
    ctx.shadowBlur=0;ctx.fillStyle='#3b1a6e';ctx.beginPath();ctx.arc(cx,y+46,4,0,7);ctx.fill();
    if(!zip.drag&&y<H*.4){
      ctx.lineWidth=3;ctx.lineCap='round';
      for(let k=0;k<3;k++){
        const yy=y+76+k*16;
        ctx.strokeStyle='rgba(255,255,255,'+(.85-k*.2)*(.5+.5*Math.sin(time*5-k))+')';
        ctx.beginPath();ctx.moveTo(cx-10,yy);ctx.lineTo(cx,yy+9);ctx.lineTo(cx+10,yy);ctx.stroke();
      }
    }
  }
  ctx.restore();
}
function fall(o,dt){
  if(o.st!=='fall')return;
  o.vy+=3600*dt;o.y+=o.vy*dt;
  if(o.y>=o.r){
    o.y=o.r;o.sq=1;puff();if(!rm)shake=Math.max(shake,5);
    if(Math.abs(o.vy)>240)o.vy*=-.25;
    else{
      o.vy=0;o.st='land';
      if(o===tiers[2]){
        landed=true;tLand=time;tText=time+.7;
        for(let i=0;i<5;i++){balloon();balloons[balloons.length-1].y=ymax+20+i*60}
        for(let i=0;i<6;i++)pend.push({at:time+.1+i*.14,x:xmin+(xmax-xmin)*(.1+.8*Math.random()),y:ymin+(ymax-ymin)*(.1+.3*Math.random()),n:70,v:320});
      }
    }
  }
}

function update(dt){
  time+=dt;flash*=Math.exp(-dt*3);shake*=Math.exp(-dt*10);
  if(phase==='aim'&&shell.alive&&Math.random()<dt*10)spark(shell.x+9,shell.dy-47,30,'#ffe27a',.5);
  for(let i=pend.length-1;i>=0;i--)if(time>=pend[i].at){const p=pend.splice(i,1)[0];burst(p.x,p.y,rc(),p.n,p.v);if(!rm)shake=Math.max(shake,3)}
  if(phase!=='aim'){
    bgMix=Math.min(1,bgMix+dt*1.4);
    spawnT-=dt;if(spawnT<0){spawnT=.4+Math.random()*.5;rocket()}
  }
  if(phase==='zip'){
    zip.y+=(zip.t-zip.y)*(1-Math.exp(-dt*18));
    if(zip.y>=H-10&&!zip.done){
      zip.done=true;zip.y=H;phase='build';tHit=time+.6;flash=.7;$('hint').style.display='none';
      for(let i=0;i<5;i++)pend.push({at:time+i*.12,x:xmin+(xmax-xmin)*Math.random(),y:ymin+(ymax-ymin)*(.1+.35*Math.random()),n:70,v:320});
    }
  }
  if(zip.done&&zip.on){zip.p=Math.min(1,zip.p+dt/.9);zip.off=ease(zip.p)*(W/2+40);if(zip.p>=1)zip.on=false}
  if(phase==='build'){
    const T=time-tHit;
    if(plate.st==='wait'&&T>.5){plate.st='fall';plate.y=ymin-60;plate.vy=0}
    tiers.forEach((t,k)=>{if(t.st==='wait'&&T>1.2+k*.42){t.st='fall';t.y=ymin-t.h-60;t.vy=0}});
    fall(plate,dt);tiers.forEach(t=>fall(t,dt));
    plate.sq=Math.max(0,plate.sq-dt*6);tiers.forEach(t=>t.sq=Math.max(0,t.sq-dt*6));
    if(landed){
      ballT-=dt;if(ballT<0){ballT=.5+Math.random()*.5;balloon()}
      if(time-tText>3.8)$('again').style.display='block';
    }
    cam.z+=((landed?1.16:1.1)-cam.z)*(1-Math.exp(-dt*3));
  }
  /* rockets shot by the bow */
  for(const a of arrows){
    for(let k=0;k<3&&!a.dead;k++){
      const h=dt/3;a.x+=a.vx*h;a.vy+=G*h;a.y+=a.vy*h;a.ang=Math.atan2(a.vy,a.vx);
      if(phase==='aim'&&shell.alive&&Math.hypot(a.x-shell.x,a.y-shell.dy)<HR){a.dead=true;pop()}
    }
    const tx=a.x-Math.cos(a.ang)*70,ty=a.y-Math.sin(a.ang)*70;
    for(let i=0;i<2;i++)spark(tx,ty,45,i?'#ffb347':'#fff3b0',.45);
    if(a.x>xmax+120||a.x<xmin-120||a.y>ymax+150||a.y<ymin-700)a.dead=true;
  }
  arrows=arrows.filter(a=>!a.dead);
  /* particles */
  for(const p of parts){
    p.life+=dt;
    if(p.k==='r'){
      p.y+=p.vy*dt;p.x+=Math.sin(time*9+p.ty)*10*dt;
      parts.push({k:'k',x:p.x,y:p.y,px:p.x,py:p.y,vx:(Math.random()-.5)*20,vy:30,c:'#ffd27a',s:1.8,life:0,max:.4,drag:2,g:0});
      if(p.y<=p.ty){burst(p.x,p.y,p.c,60+((Math.random()*30)|0),240+Math.random()*90);p.life=p.max}
    }else{
      p.px=p.x;p.py=p.y;const d=Math.exp(-dt*p.drag);
      p.vx*=d;p.vy=p.vy*d+p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
    }
  }
  parts=parts.filter(p=>p.life<p.max);
  if(parts.length>1400)parts.splice(0,parts.length-1400);
  for(const b of balloons){b.y+=b.vy*dt;b.wob*=Math.exp(-dt*5)}
  balloons=balloons.filter(b=>b.y>ymin-120);
  /* handwriting sparkle */
  if(landed&&time>tText&&time<tText+2.1){
    const p=ease(Math.min(1,(time-tText)/1.9)),tw=textW();
    spark(CX-tw/2+tw*p,360+Math.random()*50,70,'#ffe9a8',.7,true);spark(CX-tw/2+tw*p,380+Math.random()*30,70,'#fff',.6,true);
  }
}
const ease=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;

/* drawing */
function drawShell(){
  const x=shell.x,y=shell.y+Math.sin(time*1.8)*10,r=30*(1+.05*Math.sin(time*6));shell.dy=y;
  let g=ctx.createRadialGradient(x,y,8,x,y,115);g.addColorStop(0,'rgba(255,200,80,.5)');g.addColorStop(1,'rgba(255,200,80,0)');
  ctx.fillStyle=g;ctx.fillRect(x-120,y-120,240,240);
  g=ctx.createRadialGradient(x-r*.3,y-r*.35,r*.1,x,y,r);g.addColorStop(0,'#fff6c9');g.addColorStop(.5,'#ffb703');g.addColorStop(1,'#e85d04');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.65)';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(x,y,r,r*.3,-.4,0,7);ctx.stroke();
  ctx.strokeStyle='#e9d9b5';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(x+4,y-r);ctx.quadraticCurveTo(x+14,y-r-14,x+9,y-r-17);ctx.stroke();
  for(let k=0;k<3;k++){
    const a=time*2+k*2.09,sx=x+Math.cos(a)*(r+18),sy=y+Math.sin(a)*(r+18)*.8,sz=3+1.5*Math.sin(time*7+k);
    ctx.fillStyle='#fff6c9';ctx.beginPath();for(let i=0;i<8;i++){const rr=i%2?sz*.35:sz;ctx.lineTo(sx+Math.cos(i*Math.PI/4)*rr,sy+Math.sin(i*Math.PI/4)*rr)}ctx.fill();
  }
}
function arrowShape(){
  ctx.fillStyle='#e9d9b5';ctx.fillRect(-72,-1,24,2);
  ctx.fillStyle='#4cc9f0';
  for(const m of[-1,1]){ctx.beginPath();ctx.moveTo(-50,4*m);ctx.lineTo(-60,11*m);ctx.lineTo(-38,4*m);ctx.closePath();ctx.fill()}
  ctx.fillStyle='#ff4d6d';ctx.beginPath();ctx.roundRect(-50,-5,40,10,3);ctx.fill();
  ctx.fillStyle='#fff';ctx.fillRect(-40,-5,5,10);ctx.fillRect(-28,-5,5,10);
  ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.moveTo(5,0);ctx.lineTo(-10,-5.5);ctx.lineTo(-10,5.5);ctx.fill();
}
function drawBow(){
  ctx.save();ctx.translate(BX,BY);
  const pull=drag?len*.28:0;
  ctx.rotate(drag?aim:-.85);
  ctx.lineCap='round';ctx.strokeStyle='#dcd8ea';ctx.lineWidth=6;
  ctx.beginPath();ctx.moveTo(-8,-46);ctx.quadraticCurveTo(26,0,-8,46);ctx.stroke();
  ctx.strokeStyle='#fff';ctx.lineWidth=1.6;
  ctx.beginPath();ctx.moveTo(-8,-46);ctx.lineTo(-6-pull,0);ctx.lineTo(-8,46);ctx.stroke();
  ctx.translate(-6-pull+58,0);arrowShape();
  ctx.restore();
}
function trajectory(){
  if(!drag||len<=25)return;
  const sp=250+len*6.2;let x=BX+Math.cos(aim)*50,y=BY+Math.sin(aim)*50,vx=Math.cos(aim)*sp,vy=Math.sin(aim)*sp;
  for(let i=0;i<28;i++){
    for(let k=0;k<3;k++){x+=vx*.015;vy+=G*.015;y+=vy*.015}
    ctx.fillStyle='rgba(255,246,232,'+(.75-i*.025)+')';ctx.beginPath();ctx.arc(x,y,2.8,0,7);ctx.fill();
  }
}
function drawParts(front){
  ctx.globalCompositeOperation='lighter';ctx.lineCap='round';
  for(const p of parts){
    if(!!p.f!==front)continue;
    if(p.k==='r'){ctx.globalAlpha=1;ctx.fillStyle='#fff3b0';ctx.beginPath();ctx.arc(p.x,p.y,3,0,7);ctx.fill();continue}
    const a=Math.max(0,1-p.life/p.max);
    ctx.globalAlpha=a;ctx.strokeStyle=p.c;ctx.lineWidth=p.s;
    ctx.beginPath();ctx.moveTo(p.px,p.py);ctx.lineTo(p.x+.01,p.y);ctx.stroke();
    ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.s*.8,0,7);ctx.fill();
  }
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
}
function drawBalloon(b){
  const r=b.r;ctx.save();ctx.translate(b.x+Math.sin(time*1.2+b.ph)*8,b.y);if(b.wob>.02)ctx.rotate(Math.sin(time*45)*.18*b.wob);
  ctx.strokeStyle='rgba(255,246,232,.55)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,r*1.2+6);ctx.bezierCurveTo(6,r*1.2+22,-6,r*1.2+36,0,r*1.2+54);ctx.stroke();
  const g=ctx.createRadialGradient(-r*.35,-r*.45,r*.1,0,0,r*1.3);g.addColorStop(0,b.c[0]);g.addColorStop(1,b.c[1]);
  ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,0,r,r*1.2,0,0,7);ctx.fill();
  ctx.fillStyle=b.c[1];ctx.beginPath();ctx.moveTo(0,r*1.2-1);ctx.lineTo(-4,r*1.2+6);ctx.lineTo(4,r*1.2+6);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.ellipse(-r*.38,-r*.5,r*.14,r*.26,.5,0,7);ctx.fill();
  if(b.l){ctx.fillStyle='#2a1a6b';ctx.font='bold '+(r*.95)+'px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(b.l,0,r*.05)}
  ctx.restore();
}
function drawPlate(){
  const y=plate.y,rx=150,ry=26;
  ctx.save();ctx.translate(CX,0);
  if(plate.sq>0){ctx.translate(0,y);ctx.scale(1+.04*plate.sq,1-.1*plate.sq);ctx.translate(0,-y)}
  ctx.fillStyle='rgba(10,0,60,.3)';ctx.beginPath();ctx.ellipse(0,y+16,rx+6,ry,0,0,7);ctx.fill();
  const g=ctx.createLinearGradient(-rx,0,rx,0);g.addColorStop(0,'#7a5412');g.addColorStop(.35,'#f3d27a');g.addColorStop(1,'#8a6218');
  ctx.beginPath();ctx.moveTo(-rx,y);ctx.lineTo(-rx,y+9);ctx.ellipse(0,y+9,rx,ry,0,Math.PI,0,true);ctx.lineTo(rx,y);ctx.ellipse(0,y,rx,ry,0,0,Math.PI,true);ctx.closePath();ctx.fillStyle=g;ctx.fill();
  ctx.beginPath();ctx.ellipse(0,y,rx,ry,0,0,7);ctx.fillStyle='#e9c46a';ctx.fill();
  ctx.beginPath();ctx.ellipse(0,y,rx*.9,ry*.82,0,0,7);ctx.fillStyle='#b8862a';ctx.fill();
  ctx.restore();
}
function drawTier(t){
  const rx=t.w/2,ry=t.w*.1,y0=t.y,yb=t.y+t.h;
  ctx.save();ctx.translate(CX,0);
  if(t.sq>0){ctx.translate(0,yb);ctx.scale(1+.1*t.sq,1-.14*t.sq);ctx.translate(0,-yb)}
  ctx.beginPath();ctx.moveTo(-rx,y0);ctx.lineTo(-rx,yb);ctx.ellipse(0,yb,rx,ry,0,Math.PI,0,true);ctx.lineTo(rx,y0);ctx.ellipse(0,y0,rx,ry,0,0,Math.PI,true);ctx.closePath();
  ctx.fillStyle=t.c;ctx.fill();
  const hl=.3+.18*Math.sin(time*1.4+t.i),g=ctx.createLinearGradient(-rx,0,rx,0);
  g.addColorStop(0,'rgba(40,10,90,.3)');g.addColorStop(hl,'rgba(255,255,255,.32)');g.addColorStop(1,'rgba(40,10,90,.4)');
  ctx.fillStyle=g;ctx.fill();
  ctx.fillStyle='#fffaf0';
  ctx.beginPath();ctx.ellipse(0,y0,rx,ry,0,0,Math.PI);ctx.ellipse(0,y0+9,rx,ry,0,Math.PI,0,true);ctx.closePath();ctx.fill();
  const n=Math.round(t.w/22);
  for(let j=0;j<n;j++){
    const cx=(-.9+1.8*(j+.5)/n)*rx,ey=y0+9+ry*Math.sqrt(1-(cx/rx)*(cx/rx));
    ctx.beginPath();ctx.arc(cx,ey,4+((j*7+t.i*3)%3)*1.8,0,Math.PI);ctx.fill();
  }
  ctx.beginPath();ctx.ellipse(0,y0,rx,ry,0,0,7);ctx.fillStyle='#fffdf6';ctx.fill();
  ctx.beginPath();ctx.ellipse(0,y0,rx*.86,ry*.78,0,0,7);ctx.fillStyle=t.c;ctx.globalAlpha=.3;ctx.fill();ctx.globalAlpha=1;
  if(t.i===2&&landed){
    const k=Math.min(1,(time-tLand)/.4);
    for(const dx of[-26,0,26]){
      const by=y0+(dx?ry*.15:ry*.35),h=26*k;
      ctx.fillStyle='#fff6e8';ctx.fillRect(dx-3,by-h,6,h);
      ctx.fillStyle='#4cc9f0';for(let q=0;q<3;q++)if(h>q*9+4)ctx.fillRect(dx-3,by-h+q*9+3,6,3);
      if(k>.7){
        const f=.9+.1*Math.sin(time*20+dx),fy=by-h-9;
        const gr=ctx.createRadialGradient(dx,fy,1,dx,fy,30);gr.addColorStop(0,'rgba(255,209,102,.8)');gr.addColorStop(1,'rgba(255,209,102,0)');
        ctx.fillStyle=gr;ctx.fillRect(dx-32,fy-32,64,64);
        ctx.fillStyle='#ffb347';ctx.beginPath();ctx.ellipse(dx,fy,4,8*f,0,0,7);ctx.fill();
        ctx.fillStyle='#fff3b0';ctx.beginPath();ctx.ellipse(dx,fy+2,2,4*f,0,0,7);ctx.fill();
      }
    }
  }
  ctx.restore();
}
function fitSize(txt,max,start){
  ctx.font=start+'px '+FONT;const w=ctx.measureText(txt).width;
  return w>max?start*max/w:start;
}
function textW(){const sz=fitSize('Happy Birthday',380,86);ctx.font=sz+'px '+FONT;return ctx.measureText('Happy Birthday').width}
function goldFill(y,sz){
  const g=ctx.createLinearGradient(0,y-sz*.8,0,y+sz*.25);
  g.addColorStop(0,'#fff7d6');g.addColorStop(.5,'#f3d27a');g.addColorStop(1,'#c9972f');return g;
}
function drawText(){
  if(!landed||time<tText)return;
  const p=ease(Math.min(1,(time-tText)/1.9));
  const sz=fitSize('Happy Birthday',380,86),y=395;
  ctx.font=sz+'px '+FONT;ctx.textAlign='center';
  const w=ctx.measureText('Happy Birthday').width;
  ctx.save();ctx.beginPath();ctx.rect(CX-w/2-14,y-sz,(w+28)*p,sz*1.5);ctx.clip();
  ctx.shadowColor='rgba(255,214,120,.9)';ctx.shadowBlur=20;
  ctx.fillStyle=goldFill(y,sz);ctx.fillText('Happy Birthday',CX,y);
  ctx.shadowBlur=0;ctx.strokeStyle='rgba(255,250,225,.8)';ctx.lineWidth=.8;ctx.strokeText('Happy Birthday',CX,y);
  ctx.restore();
  if(name){
    const a=Math.max(0,Math.min(1,(time-tText-1.7)/.8));
    if(a>0){
      const s2=fitSize(name,360,64),y2=468;
      ctx.save();ctx.globalAlpha=a;ctx.font=s2+'px '+FONT;ctx.textAlign='center';
      ctx.shadowColor='rgba(255,214,120,.9)';ctx.shadowBlur=16;ctx.fillStyle=goldFill(y2,s2);
      ctx.translate(0,(1-a)*10);ctx.fillText(name,CX,y2);ctx.restore();
    }
  }
}
function drawNavy(){
  let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0a0733');g.addColorStop(1,'#1a0c4d');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(130,110,255,.08)';ctx.lineWidth=1;ctx.beginPath();
  const st=36*u;
  for(let x=ox%st;x<W;x+=st){ctx.moveTo(x,0);ctx.lineTo(x,H)}
  for(let y=oy%st;y<H;y+=st){ctx.moveTo(0,y);ctx.lineTo(W,y)}
  ctx.stroke();
}
function drawBg(){
  if(bgMix<1)drawNavy();
  if(bgMix>0){
    const g=ctx.createRadialGradient(W/2,H*.62,10,W/2,H*.62,Math.max(W,H)*.85);
    g.addColorStop(0,'#2f8cff');g.addColorStop(.5,'#5b3bd8');g.addColorStop(1,'#26116b');
    ctx.globalAlpha=bgMix;ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
  }
}
function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  drawBg();
  if(zip.on)drawPanels();
  const sx=(Math.random()-.5)*shake*u,sy=(Math.random()-.5)*shake*u;
  ctx.save();ctx.translate(ox+sx,oy+sy);ctx.scale(u,u);
  drawParts(false);
  ctx.save();ctx.translate(CX,640);ctx.scale(cam.z,cam.z);ctx.translate(-CX,-640);
  if(phase==='aim'){
    if(shell.alive)drawShell();
    drawBow();trajectory();
  }
  if(plate.st!=='wait'){
    if(landed){const g=ctx.createRadialGradient(CX,620,10,CX,620,230);g.addColorStop(0,'rgba(255,225,140,.25)');g.addColorStop(1,'rgba(255,225,140,0)');ctx.fillStyle=g;ctx.fillRect(CX-240,400,480,400)}
    drawPlate();
    for(const t of tiers)if(t.st!=='wait')drawTier(t);
  }
  ctx.restore();
  for(const b of balloons)drawBalloon(b);
  for(const a of arrows){ctx.save();ctx.translate(a.x,a.y);ctx.rotate(a.ang);arrowShape();ctx.restore()}
  drawText();
  drawParts(true);
  ctx.restore();
  drawZipHW();
  if(flash>.02){ctx.fillStyle='rgba(255,240,200,'+flash*.55+')';ctx.fillRect(0,0,W,H)}
}
let last=performance.now();
function loop(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  update(dt);draw();requestAnimationFrame(loop);
}
$('again').onclick=reset;
addEventListener('resize',resize);
try{document.fonts.load('80px "Great Vibes"')}catch(e){}
resize();reset();
requestAnimationFrame(loop);
})();
</script>
