<body class="fx-on">

<!-- shared SVG filter: rough ink edge for stamps -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/>
  </filter>
</svg>

<!-- screen effect layers -->
<div class="fx-layer fx-grain" aria-hidden="true"></div>
<div class="fx-layer fx-scan" aria-hidden="true"></div>
<div class="fx-layer fx-roll" aria-hidden="true"></div>
<div class="fx-layer fx-vignette" aria-hidden="true"></div>

<div id="boot" class="boot" hidden></div>
<div id="portal" class="portal" hidden></div>
<div id="app" class="app" hidden></div>
<div id="overlays"></div>
<div id="toasts" aria-live="polite"></div>
